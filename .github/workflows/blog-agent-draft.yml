name: Blog agent - write a draft

on:
  schedule:
    # Daily draft around 11:00 Japan time. GitHub sometimes skips or delays scheduled runs,
    # so there are backup slots; the agent makes only one draft per day (manual runs always run).
    - cron: "13 2 * * *"    # 11:13 JST
    - cron: "47 2 * * *"    # 11:47 JST (backup)
    - cron: "29 3 * * *"    # 12:29 JST (backup)
    - cron: "11 5 * * *"    # 14:11 JST (backup)
    # For testing every 15 minutes, use this line instead (costs add up fast, the monthly cap still applies):
    # - cron: "*/15 * * * *"
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: blog-agent          # never run at the same time as the reply checker
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          ref: blog-agent-state
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r site/agent/requirements.txt
      - run: |
          git config --global user.name "humi-blog-agent"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python site/agent/blog_agent.py generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_DIR: site
          STATE_DIR: state
